<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>오늘 뭐 먹지 고민 끝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>

  :root{
    color-scheme:light;
    /* Color — 딥 틸 on 화이트 */
    --bg:            #ffffff;
    --surface:       #fbfbfc;
    --border:        #e6e6ea;
    --border-soft:   #eef0f1;
    --accent:        #1f8a70;
    --accent-dark:   #136a53;
    --accent-tint:   #e0f2ec;
    --text:          #161826;
    --text-body:     #4a4d59;
    --text-muted:    #8a8d9a;
    --text-faint:    #9a9da8;

    /* Radius */
    --r-sm: 8px;
    --r-md: 10px;
    --r-lg: 12px;
    --r-xl: 14px;
    --r-pill: 999px;

    /* Shadow */
    --shadow-page: 0 0 0 1px #e6e6ea, 0 8px 32px rgba(20,30,28,0.06);
    --ring-accent: 0 0 0 2px var(--accent);
  }
  *{box-sizing:border-box;}
  img{max-width:100%;}
  [hidden]:not([hidden=until-found]){display:none!important;}
  body{
    margin:0; padding:28px 16px; background:#f3f4f5; color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  a{color:var(--accent); text-decoration:none;}
  a:hover{color:var(--accent-dark); text-decoration:underline;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .shell{
    max-width:1180px; margin:0 auto; background:var(--bg);
    border-radius:var(--r-xl); box-shadow:var(--shadow-page); padding:32px;
  }

  /* ---- fallback banner ---- */
  .banner{
    background:#fff4f2; border:1px solid #f3c7bd; color:#8a3520; border-radius:var(--r-md);
    padding:10px 14px; font-size:12px; line-height:1.6; margin-bottom:20px;
  }
  .banner button{
    background:none; border:1px solid #8a3520; color:#8a3520; border-radius:var(--r-sm);
    padding:3px 10px; font-size:11px; margin-top:6px; cursor:pointer;
  }

  /* ---- header ---- */
  .page-header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
  .page-title{font-size:26px; font-weight:600; color:var(--text); margin:0 0 4px;}
  .page-sub{font-size:13px; font-weight:400; color:var(--text-muted); margin:0; line-height:1.5;}
  .rail-pill{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    border-radius:var(--r-pill); padding:6px 12px; font-size:12px; color:var(--text-muted); white-space:nowrap;
  }
  .rail-pill i{font-size:14px;}

  /* ---- 3-column board ---- */
  .board{display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:20px; margin-bottom:20px;}
  @media (max-width:1023px){
    .board{grid-template-columns:1fr;}
    #map{min-height:260px;}
  }

  .panel{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--r-lg);}
  .section-label{
    font-size:12px; font-weight:600; color:var(--text-muted); letter-spacing:.04em;
    text-transform:uppercase; margin:0 0 4px;
  }

  /* ---- 조건 패널 ---- */
  .panel-filters{padding:20px; display:flex; flex-direction:column; gap:16px;}
  .filter-group{display:flex; flex-direction:column; gap:8px;}
  .group-label{font-size:11px; font-weight:500; color:var(--text-faint); margin:0;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:#fff; color:var(--text-body); border:1px solid var(--border); padding:7px 14px;
    border-radius:var(--r-pill); font-size:13px; font-weight:400; cursor:pointer; user-select:none; transition:.12s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent);}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500;}
  .filter-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
  .reset-link{
    background:none; border:none; color:var(--text-faint); text-decoration:underline;
    font-size:11px; cursor:pointer; padding:0; align-self:flex-start;
  }
  .cta{
    width:100%; padding:13px; border:none; border-radius:var(--r-md); background:var(--accent);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:background .12s, transform .08s;
  }
  .cta:hover{background:var(--accent-dark);}
  .cta:active{transform:translateY(1px);}
  .cta:disabled{opacity:.45; cursor:not-allowed;}
  .cta-help{font-size:11px; color:var(--text-faint); text-align:center; margin:0;}

  /* ---- 결과 카드 ---- */
  .result-col{display:flex; flex-direction:column;}
  #resultCard.card{
    background:var(--surface); border-radius:var(--r-lg); padding:28px; box-shadow:var(--ring-accent);
    display:flex; flex-direction:column; min-height:320px;
  }
  .result-empty{
    background:var(--surface); border-radius:var(--r-lg); padding:28px; min-height:320px;
    box-shadow:0 0 0 1px var(--border-soft); display:flex; align-items:center; justify-content:center;
    text-align:center; color:var(--text-muted); font-size:14px;
  }
  #resultCard:not([hidden]) ~ .result-empty{display:none;}
  #resultCard[hidden] ~ .result-empty{display:flex;}
  @keyframes resultIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  #resultCard:not([hidden]){animation:resultIn .15s ease-out;}

  .kicker{font-size:10px; font-weight:700; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:8px;}
  .result-name{font-size:30px; font-weight:600; color:var(--text); margin:0 0 4px; line-height:1.25;}
  .result-meta{font-size:12px; font-weight:400; color:var(--text-muted); margin:0 0 16px;}
  .result-badge{
    display:inline-block; background:var(--accent-tint); color:var(--accent-dark); font-size:16px;
    font-weight:600; padding:9px 16px; border-radius:var(--r-md); margin-bottom:16px; align-self:flex-start;
  }
  .other-label{font-size:11px; font-weight:500; color:var(--text-faint); margin:0 0 6px;}
  .other-list{margin:0 0 20px; padding-left:18px; font-size:13px; font-weight:400; line-height:1.7; color:var(--text-body);}
  .result-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto;}
  .btn{
    flex:1; padding:10px 12px; border-radius:var(--r-sm); font-size:13px; font-weight:500; cursor:pointer;
    text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    gap:6px; white-space:nowrap; transition:background .12s;
  }
  .btn:hover{text-decoration:none;}
  .btn-outline-accent{background:transparent; border:1px solid var(--accent); color:var(--accent);}
  .btn-outline-accent:hover{background:var(--accent-tint); color:var(--accent);}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text-body);}
  .btn-outline:hover{background:#f4f5f6; color:var(--text-body);}

  /* ---- 지도 패널 ---- */
  .panel-map{padding:16px; display:flex; flex-direction:column;}
  #map{flex:1; min-height:220px; border-radius:var(--r-md); background:#f4f6f5;}

  /* ---- 하단 아코디언 ---- */
  .accordion{border:1px solid var(--border-soft); border-radius:var(--r-md); overflow:hidden; background:var(--bg);}
  .accordion summary{
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text); padding:14px 16px;
    list-style:none; display:flex; justify-content:space-between; align-items:center;
  }
  .accordion summary::-webkit-details-marker{display:none;}
  .accordion summary i{color:var(--text-muted); transition:transform .12s;}
  .accordion[open] summary i{transform:rotate(180deg);}
  .list-body{padding:0 16px 4px; border-top:1px solid var(--border-soft);}
  .accordion-foot{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px 16px; font-size:12px; color:var(--text-muted);
  }
  .accordion-foot button{
    padding:7px 14px; border-radius:var(--r-pill); border:1px solid var(--border);
    background:#fff; color:var(--text-body); font-size:12px; cursor:pointer;
  }
  .accordion-foot button:hover{border-color:var(--accent); color:var(--accent);}
  .empty-state{text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;}

  /* ---- 식당 목록 행 (JS가 생성) ---- */
  .r-row{background:#fff; border:1px solid var(--border); border-radius:var(--r-md); padding:12px; margin-top:8px;}
  .r-row.excluded{opacity:.55;}
  .r-row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .r-row-name{font-weight:600; font-size:13px; color:var(--text);}
  .r-row-dist{font-size:12px; color:var(--text-muted); white-space:nowrap;}
  .r-row-cat{font-size:12px; color:var(--text-muted); margin:2px 0 8px;}
  .badge{
    display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:6px;
    background:var(--accent-tint); color:var(--accent-dark); margin-left:6px;
  }
  .side-toggle{display:flex; gap:4px; margin-bottom:8px;}
  .side-toggle button{
    flex:1; font-size:11px; padding:5px; border-radius:var(--r-sm); border:1px solid var(--border);
    background:#fff; color:var(--text-body); cursor:pointer;
  }
  .side-toggle button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .edit-form{display:none; margin-top:8px; border-top:1px dashed var(--border); padding-top:8px;}
  .edit-form.open{display:block;}
  .edit-form label{display:block; font-size:11px; color:var(--text-faint); margin:6px 0 3px;}
  .edit-form input[type="text"], .edit-form textarea, .edit-form select{
    width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:var(--r-sm);
    background:#fff; color:var(--text); font-family:inherit; font-size:13px;
  }
  .edit-form textarea{min-height:44px; resize:vertical;}
  .edit-form .chips{margin-bottom:4px;}
  .edit-toggle{
    background:none; border:none; color:var(--accent); font-size:12px; font-weight:600;
    cursor:pointer; padding:0; margin-top:6px;
  }
  .btn.primary{
    flex:none; margin-top:8px; background:var(--accent); color:#fff; border:1px solid var(--accent);
    padding:8px 16px; border-radius:var(--r-sm); font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn.primary:hover{background:var(--accent-dark);}
  .excluded-toggle{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-top:1px dashed var(--border); color:var(--text-faint); font-size:11px;
    padding:10px 0 0; margin-top:8px; cursor:pointer;
  }
  .excluded-toggle:hover{color:var(--text-muted);}
  .excluded-wrap{display:none;}
  .excluded-wrap.open{display:block;}

</style>
</head><body>

<div class="shell">

  <div id="fallbackBanner" class="banner" hidden>
    카카오맵 연동을 사용할 수 없어 <b>예시 데이터</b>로 표시 중이에요. (카카오 키 미설정 / 도메인 미등록 / 이 화면이 Claude Artifact인 경우 등)
    <button id="retryLiveBtn" type="button">다시 시도</button>
  </div>

  <header class="page-header">
    <div>
      <h1 class="page-title">오늘 뭐 먹지 고민 끝</h1>
      <p class="page-sub">가산디지털1로 136 기준 반경 250m · 1호선 철길 서쪽만 추천해요</p>
    </div>
    <div class="rail-pill"><i class="ph ph-train" aria-hidden="true"></i>1호선 서쪽 구역</div>
  </header>

  <div class="board">

    <div class="panel panel-filters">
      <div class="section-label">조건</div>
      <div class="filter-group">
        <div class="group-label">형태</div>
        <div class="chips" id="chips-type"></div>
      </div>
      <div class="filter-group">
        <div class="group-label">맛</div>
        <div class="chips" id="chips-taste"></div>
      </div>
      <div class="filter-group">
        <div class="group-label">종류</div>
        <div class="chips" id="chips-cuisine"></div>
      </div>
      <div class="filter-foot">
        <button class="reset-link" id="resetFilters" type="button">조건 초기화</button>
        <button class="cta" id="recommendBtn" type="button">오늘 뭐 먹지?</button>
        <p class="cta-help" id="ctaHelp" hidden></p>
      </div>
    </div>

    <div class="result-col">
      <div class="card" id="resultCard" hidden>
        <span class="kicker">추천메뉴</span>
        <div class="result-name" id="resultName"></div>
        <div class="result-meta" id="resultMeta"></div>
        <div class="result-badge" id="resultSignature"></div>
        <div class="other-label">다른메뉴</div>
        <ul class="other-list" id="resultOther"></ul>
        <div class="result-actions">
          <button class="btn btn-outline-accent" id="rerollBtn" type="button"><i class="ph ph-shuffle" aria-hidden="true"></i>다시 뽑기</button>
          <a class="btn btn-outline" id="resultDirectionsLink" href="#" target="_blank" rel="noopener" hidden><i class="ph ph-navigation-arrow" aria-hidden="true"></i>길찾기</a>
          <a class="btn btn-outline" id="resultMapLink" href="#" target="_blank" rel="noopener">지도에서 보기</a>
        </div>
      </div>
      <div class="result-empty">조건을 고르고 버튼을 눌러보세요</div>
    </div>

    <div class="panel panel-map" id="mapCard">
      <div class="section-label">지도</div>
      <div id="map"></div>
    </div>

  </div>

  <details class="accordion">
    <summary>주변 식당 목록 · 정보 편집<i class="ph ph-caret-down" aria-hidden="true"></i></summary>
    <div class="list-body" id="listBody"></div>
    <div class="accordion-foot">
      <button id="researchBtn" type="button">재검색</button>
      <div id="lastSearchAt"></div>
    </div>
  </details>

</div>

<script>
(function(){
  "use strict";

  // ============ CONFIG ============
  // 카카오 디벨로퍼스(developers.kakao.com) > 내 애플리케이션 > 앱 키의 "JavaScript 키"를 넣으세요.
  // 그리고 앱 설정 > 플랫폼 > Web에 이 페이지를 실제로 서빙할 도메인(예: GitHub Pages 주소)을 등록해야
  // 지도가 로드됩니다. 값을 채우지 않으면 자동으로 예시(seed) 데이터 모드로 동작합니다.
  var CONFIG = {
    KAKAO_JS_KEY: '9394ac1268768ad4accfdf8623a92f16',
    OFFICE_ADDRESS: '서울 금천구 가산디지털1로 136',
    RADIUS_M: 250,
    RAIL_STATION_A_QUERY: '가산디지털단지역',
    RAIL_STATION_B_QUERY: '독산역',
    STORAGE_PREFIX: 'lunch-recommender:v1:',
    SDK_LOAD_TIMEOUT_MS: 4000,
    WALK_SPEED_M_PER_MIN: 67, // 성인 평균 도보 속도(시속 약 4km) 기준 대략치. 실제 경로 기반이 아닌 직선거리 추정.
    // 카카오맵 비공식 place-api(panel3)를 CORS 우회해서 대신 호출해주는 Cloudflare Worker 프록시.
    // 카카오 Local API는 메뉴 정보를 제공하지 않아서, 별도로 이 프록시를 통해 실제 메뉴(이름/가격)를
    // 가져와 보강한다. 응답이 없거나 실패하면 조용히 키워드 추정(TAG_RULES)으로 폴백한다.
    // 비워두면(빈 문자열) 메뉴 보강 자체를 건너뛴다.

  };

  var TYPE_OPTIONS = ['면','밥','국물','구이','튀김','분식','기타'];
  var TASTE_OPTIONS = ['매운맛','순한맛','보통'];

  // 카테고리명/상호명 키워드 → 태그·추천메뉴 자동 추정 규칙 (선매칭 우선)
  var TAG_RULES = [
    { kw:['돈까스','돈가스'], type:['튀김','밥'], taste:'순한맛', cuisine:'일식', menu:'돈까스' },
    { kw:['라멘'], type:['면','국물'], taste:'보통', cuisine:'일식', menu:'라멘' },
    { kw:['초밥','스시'], type:['밥'], taste:'순한맛', cuisine:'일식', menu:'초밥' },
    { kw:['칼국수'], type:['면','국물'], taste:'순한맛', cuisine:'한식', menu:'칼국수' },
    { kw:['냉면'], type:['면'], taste:'보통', cuisine:'한식', menu:'물냉면' },
    { kw:['짬뽕'], type:['면','국물'], taste:'매운맛', cuisine:'중식', menu:'짬뽕' },
    { kw:['짜장','중화요리','중국요리','중국집'], type:['면'], taste:'순한맛', cuisine:'중식', menu:'짜장면' },
    { kw:['떡볶이','분식'], type:['분식'], taste:'매운맛', cuisine:'한식', menu:'떡볶이' },
    { kw:['국밥'], type:['국물','밥'], taste:'보통', cuisine:'한식', menu:'순대국밥' },
    { kw:['찌개','백반'], type:['국물','밥'], taste:'보통', cuisine:'한식', menu:'김치찌개' },
    { kw:['삼겹살','고기','구이'], type:['구이'], taste:'보통', cuisine:'한식', menu:'삼겹살' },
    { kw:['치킨'], type:['튀김'], taste:'보통', cuisine:'한식', menu:'후라이드치킨' },
    { kw:['피자'], type:['기타'], taste:'보통', cuisine:'양식', menu:'피자' },
    { kw:['파스타','양식'], type:['면'], taste:'순한맛', cuisine:'양식', menu:'파스타' },
    { kw:['카페','커피','디저트'], type:['기타'], taste:'보통', cuisine:'카페-디저트', menu:'아메리카노' },
    { kw:['샐러드'], type:['기타'], taste:'순한맛', cuisine:'양식', menu:'샐러드' },
    { kw:['쌀국수','베트남'], type:['면','국물'], taste:'매운맛', cuisine:'기타', menu:'쌀국수' },
    { kw:['마라'], type:['국물','면'], taste:'매운맛', cuisine:'중식', menu:'마라탕' },
    { kw:['곱창','막창'], type:['구이'], taste:'매운맛', cuisine:'한식', menu:'곱창구이' },

  // 카카오 연동 실패 시 보여줄 예시 데이터입니다. 실제 상호가 아니며, 재검색이 성공하면 실제 데이터로 대체됩니다.

      type:['국물','밥'], taste:'보통', cuisine:'한식', signatureMenu:'순두부찌개', otherMenu:['된장찌개','제육볶음','공기밥추가'] },

    { id:'seed:3', name:'가산 돈까스(예시)', categoryName:'음식점 > 일식 > 돈까스,우동', distanceM:150,
      type:['튀김','밥'], taste:'순한맛', cuisine:'일식', signatureMenu:'등심돈까스', otherMenu:['치즈돈까스','카레돈까스','우동'] },
    { id:'seed:4', name:'산디 김밥천국(예시)', categoryName:'음식점 > 한식 > 분식', distanceM:40,
      type:['분식'], taste:'순한맛', cuisine:'한식', signatureMenu:'참치김밥', otherMenu:['떡볶이','라볶이','순대'] },
    { id:'seed:5', name:'라멘야(예시)', categoryName:'음식점 > 일식 > 면요리', distanceM:200,
      type:['면','국물'], taste:'보통', cuisine:'일식', signatureMenu:'돈코츠라멘', otherMenu:['츠케멘','교자','생맥주'] },
    { id:'seed:6', name:'가산 삼겹살집(예시)', categoryName:'음식점 > 한식 > 육류,고기', distanceM:240,
      type:['구이'], taste:'보통', cuisine:'한식', signatureMenu:'제육쌈밥(런치)', otherMenu:['된장찌개','계란찜'] },
    { id:'seed:7', name:'카페 브런치(예시)', categoryName:'카페 > 브런치카페', distanceM:60,
      type:['기타'], taste:'순한맛', cuisine:'카페-디저트', signatureMenu:'크로플세트', otherMenu:['샌드위치','아메리카노','샐러드'] },
    { id:'seed:8', name:'옛날 손칼국수(예시)', categoryName:'음식점 > 한식 > 칼국수', distanceM:180,
      type:['면','국물'], taste:'순한맛', cuisine:'한식', signatureMenu:'바지락칼국수', otherMenu:['수제비','콩국수(계절)','보쌈소자'] }
  ];

  // ============ state ============
  var state = {
    restaurants: [],
    mode: 'loading', // 'live' | 'seed' | 'loading'
    selected: { type:[], taste:[], cuisine:[] },
    recentIds: [],
    currentResultId: null,
    officeSign: null,
    railAvailable: false,
    map: null,
    highlightMarker: null,
    highlightInfoWindow: null
  };

  // ============ utils ============
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function storageGet(key, fallback){
    try{
      var raw = localStorage.getItem(CONFIG.STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function storageSet(key, value){
    try{ localStorage.setItem(CONFIG.STORAGE_PREFIX + key, JSON.stringify(value)); }catch(e){}
  }
  function haversine(a, b){
    var R = 6371000;
    var dLat = (b.lat-a.lat) * Math.PI/180;
    var dLng = (b.lng-a.lng) * Math.PI/180;
    var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
      Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }
  // 두 점 A,B가 정의하는 직선을 기준으로 P가 어느 쪽에 있는지 부호로 반환 (lng=x, lat=y 평면 근사)
  function crossSign(A, B, P){
    var bx = B.lng-A.lng, by = B.lat-A.lat;
    var px = P.lng-A.lng, py = P.lat-A.lat;
    var cross = bx*py - by*px;
    if(cross > 0) return 1;
    if(cross < 0) return -1;
    return 0;
  }
  // 카카오 category_name은 "음식점 > 중식 > 중국요리"처럼 "대분류 > 중분류 > 소분류" 구조라,
  // 중분류가 사실상 정확한 업종 정보다. TAG_RULES 키워드 매칭은 상호명 표기가 제각각이라
  // 놓치는 경우가 있으므로(예: "중화요리"는 찾지만 "중국요리"는 못 찾는 식), 카카오가 이미 알려준
  // 이 값을 최우선으로 신뢰하고 cuisine을 덮어쓴다. type/taste/signatureMenu는 카테고리만으로는
  // 알 수 없어 계속 키워드 추정에 의존한다.
  var CATEGORY_CUISINE_MAP = {
    '한식':'한식', '중식':'중식', '일식':'일식', '양식':'양식',
    '카페':'카페-디저트', '디저트':'카페-디저트', '제과,베이커리':'카페-디저트'
  };
  function categoryMidTier(categoryName){
    var parts = (categoryName||'').split('>').map(function(s){ return s.trim(); });
    return parts.length >= 2 ? parts[1] : '';
  }
  function autoFill(categoryName, name){
    var hay = (categoryName||'') + ' ' + (name||'');
    var result = null;
    for(var i=0;i<TAG_RULES.length && !result;i++){
      var rule = TAG_RULES[i];
      for(var j=0;j<rule.kw.length;j++){
        if(hay.indexOf(rule.kw[j]) !== -1){
          result = { type: rule.type.slice(), taste: rule.taste, cuisine: rule.cuisine, signatureMenu: rule.menu };
          break;
        }
      }
    }
    if(!result){ result = { type:['기타'], taste:'보통', cuisine:'한식', signatureMenu:'' }; }
    var mappedCuisine = CATEGORY_CUISINE_MAP[categoryMidTier(categoryName)];
    if(mappedCuisine){ result.cuisine = mappedCuisine; }
    return result;
  }

  // ============ overrides (localStorage 사용자 편집분) ============
  function loadOverrides(){ return storageGet('overrides', {}); }
  function saveOverride(id, patch){
    var all = loadOverrides();
    all[id] = Object.assign({}, all[id]||{}, patch, { updatedAt: new Date().toISOString() });
    storageSet('overrides', all);
    return all[id];
  }

  function mergeRecord(raw, overrides){
    var saved = overrides[raw.id] || {};
    var auto = autoFill(raw.categoryName, raw.name);
    var includedByGeometry = raw.includedByGeometry !== undefined ? raw.includedByGeometry : true;
    var manualOverride = ('manualOverride' in saved) ? saved.manualOverride : null;
    return {
      id: raw.id, source: raw.source, name: raw.name, categoryName: raw.categoryName || '',
      phone: raw.phone || '', address: raw.address || '', lat: raw.lat, lng: raw.lng,
      distanceM: raw.distanceM, placeUrl: raw.placeUrl || '',
      railSide: raw.railSide !== undefined ? raw.railSide : null,
      includedByGeometry: includedByGeometry,
      manualOverride: manualOverride,
      isIncluded: manualOverride === null ? includedByGeometry : manualOverride,
      tags: {
        type: saved.tags ? saved.tags.type : (raw.type || auto.type),
        taste: saved.tags ? saved.tags.taste : (raw.taste || auto.taste),
        cuisine: saved.tags ? saved.tags.cuisine : (raw.cuisine || auto.cuisine)
      },
      signatureMenu: saved.signatureMenu !== undefined ? saved.signatureMenu : (raw.signatureMenu || auto.signatureMenu),
      otherMenu: saved.otherMenu !== undefined ? saved.otherMenu : (raw.otherMenu || []),
      // naverPlaceId만 저장하고 signatureMenu는 직접 타이핑하지 않은 경우, 값은 saved에 있지만
      // 출처는 'manual'이 아니라 실제 조회 시점(fetchNaverMenuFor)에 결정된 값을 써야 하므로
      // saved.menuSource를 우선한다. 메인 "저장" 버튼은 항상 menuSource:'manual'을 명시해서 저장한다.
      menuSource: saved.menuSource || (saved.signatureMenu !== undefined ? 'manual' : (raw.menuSource || null)),
      // 네이버 place id는 자동 매칭이 불가능해서(공식 검색 API가 place id 자체를 안 줌) 사용자가
      // "정보 편집"에서 직접 입력해둔 값만 사용한다. 한 번 입력해두면 이후 재검색에서도 유지되고,
      // enrichMenus가 카카오보다 이 값을 우선해 네이버 메뉴를 조회한다(대개 더 잘 관리돼 있어서).
      naverPlaceId: saved.naverPlaceId || null,
      edited: !!saved.edited
    };
  }

  function setRestaurants(rawList){
    var overrides = loadOverrides();
    state.restaurants = rawList.map(function(r){ return mergeRecord(r, overrides); });
  }

  // ============ Adapter B: seed(fallback) ============
  function getSeedRestaurants(){
    return SEED_RESTAURANTS.map(function(s){
      return {
        id:s.id, source:'seed', name:s.name, categoryName:s.categoryName, distanceM:s.distanceM,
        includedByGeometry:true, railSide:null,
        type:s.type, taste:s.taste, cuisine:s.cuisine,
        signatureMenu:s.signatureMenu, otherMenu:s.otherMenu
      };
    });
  }

  // ============ Adapter A: 카카오 라이브 검색 ============
  function loadKakaoSdk(){
    return new Promise(function(resolve, reject){
      if(!CONFIG.KAKAO_JS_KEY || CONFIG.KAKAO_JS_KEY === 'YOUR_KAKAO_JAVASCRIPT_KEY'){
        reject(new Error('KAKAO_JS_KEY not configured'));
        return;
      }
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; reject(new Error('kakao sdk load timeout')); }
      }, CONFIG.SDK_LOAD_TIMEOUT_MS);
      var script = document.createElement('script');
      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(CONFIG.KAKAO_JS_KEY) + '&libraries=services&autoload=false';
      script.onload = function(){
        if(done) return; done = true; clearTimeout(timer);
        if(window.kakao && window.kakao.maps){ resolve(); }
        else { reject(new Error('kakao global missing after load')); }
      };
      script.onerror = function(){
        if(done) return; done = true; clearTimeout(timer);
        reject(new Error('kakao sdk script error (CSP block or network)'));
      };
      document.head.appendChild(script);
    });
  }

  function kakaoReady(){
    return new Promise(function(resolve){ kakao.maps.load(resolve); });
  }

  function geocodeAddress(geocoder, address){
    return new Promise(function(resolve, reject){
      geocoder.addressSearch(address, function(result, status){
        if(status === kakao.maps.services.Status.OK && result[0]){
          resolve({ lat:+result[0].y, lng:+result[0].x });
        } else { reject(new Error('geocode failed: ' + status)); }
      });
    });
  }

  // 카카오 키워드 검색은 관련도 순으로 여러 결과를 주는데, "가산디지털단지역" 같은
  // 환승역은 노선별로 여러 건(1호선/7호선 등)이 나오고 순서도 뒤섞여 있다.
  // 철길 판정 기준은 반드시 1호선이어야 하므로 category_name/place_name에
  // preferKeyword(예: "1호선")가 포함된 결과를 우선으로 고른다.
  function keywordFirst(places, query, preferKeyword){
    return new Promise(function(resolve, reject){
      places.keywordSearch(query, function(data, status){
        if(status === kakao.maps.services.Status.OK && data[0]){
          var picked = data[0];
          if(preferKeyword){
            for(var i=0;i<data.length;i++){
              var hay = (data[i].category_name||'') + ' ' + (data[i].place_name||'');
              if(hay.indexOf(preferKeyword) !== -1){ picked = data[i]; break; }
            }
          }
          resolve({ lat:+picked.y, lng:+picked.x });
        } else { reject(new Error('keyword search failed: ' + status)); }
      });
    });
  }

  function categorySearchAll(places, center, radius){
    return new Promise(function(resolve, reject){
      var all = [];
      places.categorySearch('FD6', function(data, status, pagination){
        if(status !== kakao.maps.services.Status.OK){ reject(new Error('category search failed: '+status)); return; }
        all = all.concat(data);
        if(pagination.hasNextPage){ pagination.nextPage(); }
        else { resolve(all); }
      }, { location: new kakao.maps.LatLng(center.lat, center.lng), radius: radius, sort: kakao.maps.services.SortBy.DISTANCE });
    });
  }

  // 위경도 중심점에서 북/동 방향으로 dNorthM/dEastM(미터)만큼 떨어진 좌표를 근사 계산.
  function offsetLatLng(center, dNorthM, dEastM){
    var dLat = dNorthM / 111320;
    var dLng = dEastM / (111320 * Math.cos(center.lat * Math.PI/180));
    return { lat: center.lat + dLat, lng: center.lng + dLng };
  }

  // 카카오 Local API(categorySearch/keywordSearch)는 공식 문서상 "노출 가능 문서 수 최대: 45"로
  // 하드 캡이 걸려 있다(페이지·사이즈를 아무리 조절해도 한 번의 검색으로는 45건을 못 넘김).
  // 가산디지털단지처럼 반경 250m 안에 45곳이 넘는 밀집 상권에서는 중심 1곳만 검색하면 잘려나가는
  // 식당이 생긴다. 그래서 원래 중심을 살짝 오프셋한 지점(중심+동서남북 4곳, 총 5곳)에서 서로 겹치는
  // 더 작은 원으로 나눠 검색한 뒤 place id 기준으로 병합/중복제거해서 사실상의 45건 캡을 우회한다.
  // (오프셋 0.6R + 서브반경 0.85R 조합은 원래 반경 R의 원 전체를 빈틈없이 커버하도록 계산된 값)
  function buildSearchGrid(center, radius){
    var offsetM = radius * 0.6;
    var subRadius = Math.min(20000, Math.round(radius * 0.85));
    return [
      { lat:center.lat, lng:center.lng },
      offsetLatLng(center, offsetM, 0),
      offsetLatLng(center, -offsetM, 0),
      offsetLatLng(center, 0, offsetM),
      offsetLatLng(center, 0, -offsetM)
    ].map(function(c){ return { center:c, radius:subRadius }; });
  }

  function fetchAllNearby(places, officeCoord, radius){
    var grid = buildSearchGrid(officeCoord, radius);
    return Promise.all(grid.map(function(g){
      return categorySearchAll(places, g.center, g.radius);
    })).then(function(resultsPerCell){
      var byId = {};
      resultsPerCell.forEach(function(list){
        list.forEach(function(p){ byId[p.id] = p; });
      });
      return Object.keys(byId).map(function(id){ return byId[id]; });
    });
  }

  function fetchLiveRestaurants(){
    var geocoder = new kakao.maps.services.Geocoder();
    var places = new kakao.maps.services.Places();
    var officeCoord, stationA, stationB;

    return geocodeAddress(geocoder, CONFIG.OFFICE_ADDRESS).then(function(coord){
      officeCoord = coord;
      return Promise.all([
        keywordFirst(places, CONFIG.RAIL_STATION_A_QUERY, '1호선'),
        keywordFirst(places, CONFIG.RAIL_STATION_B_QUERY, '1호선')
      ]).catch(function(){ return null; }); // 철길 판정 실패해도 전체 흐름은 계속
    }).then(function(stations){
      if(stations){
        stationA = stations[0]; stationB = stations[1];
        state.railAvailable = true;
        state.officeSign = crossSign(stationA, stationB, officeCoord);
      } else {
        state.railAvailable = false;
      }
      return fetchAllNearby(places, officeCoord, CONFIG.RADIUS_M);
    }).then(function(raw){
      return raw.map(function(p){
        var lat = +p.y, lng = +p.x;
        // 여러 지점(그리드)에서 병합한 결과라 카카오가 주는 p.distance는 검색 중심마다 기준점이 달라
        // 신뢰할 수 없다. 항상 실제 사무실 좌표 기준 haversine 거리로 다시 계산한다.
        var distanceM = Math.round(haversine(officeCoord, {lat:lat,lng:lng}));
        var side = state.railAvailable ? crossSign(stationA, stationB, {lat:lat,lng:lng}) : null;
        var includedByGeometry = distanceM <= CONFIG.RADIUS_M && (!state.railAvailable || side === state.officeSign);
        return {
          id: 'kakao:' + p.id, source:'kakao', name: p.place_name, categoryName: p.category_name,
          phone: p.phone, address: p.road_address_name || p.address_name, lat: lat, lng: lng,
          distanceM: distanceM, placeUrl: p.place_url, railSide: side, includedByGeometry: includedByGeometry,
          kakaoPlaceId: p.id // 메뉴 프록시 호출에 필요한 카카오 원본 place id (place.map.kakao.com/{id}와 동일)
        };
      });
    }).then(function(list){
      return { list: list, officeCoord: officeCoord };
    });
  }

  // ============ 메뉴 보강 (카카오맵 비공식 place-api 프록시) ============
  // 카카오 Local API(categorySearch 등)는 메뉴 정보를 안 주기 때문에, 별도의 프록시(Cloudflare
  // Worker, CONFIG.MENU_PROXY_URL)를 통해 카카오맵 웹이 내부적으로 쓰는 비공식 place-api를 호출해
  // 실제 메뉴(이름/가격/사장님 추천 여부)를 가져온다. 문서화되지 않은 API라 예고 없이 바뀌거나 막힐
  // 수 있으므로, 개별 요청이 실패해도 전체 흐름은 계속되고 그 식당은 기존 키워드 추정(TAG_RULES)
  // 결과를 그대로 유지한다. 사용자가 이미 수동으로 편집/저장한 식당은 mergeRecord에서 saved 값이
  // 최우선이라 이 보강 결과로 덮어써지지 않는다.
  function menuCacheGet(placeId){
    var all = storageGet('menuCache', {});
    var entry = all[placeId];
    if(!entry || (Date.now() - entry.ts) > CONFIG.MENU_CACHE_TTL_MS) return undefined;
    return entry.data;
  }
  function menuCacheSet(placeId, data){
    var all = storageGet('menuCache', {});
    all[placeId] = { data: data, ts: Date.now() };
    storageSet('menuCache', all);
  }
  function formatMenuItem(it){
    if(!it) return '';
    // 카카오/네이버 둘 다 가격 미정 메뉴를 -1(또는 0)로 내려주는 경우가 있어, 양수일 때만
    // 가격을 붙인다 (truthy 체크만 하면 -1도 "유효한 가격"으로 오인해 "-1원"이 찍힘).
    var price = Number(it.price);
    var hasPrice = isFinite(price) && price > 0;
    return hasPrice ? (it.name + ' (' + price.toLocaleString('ko-KR') + '원)') : it.name;
  }
  // 프록시 응답(items[])을 { signature, other } 형태로 변환. 사장님 추천(is_recommend) 항목을
  // 대표메뉴로, 나머지를 다른메뉴로 삼는다. 추천 표시가 없으면 그냥 첫 항목을 대표메뉴로 쓴다.
  function toMenuFields(items){
    if(!items || items.length === 0) return null;
    var rec = items.filter(function(it){ return it.isRecommend; })[0] || items[0];
    var others = items.filter(function(it){ return it !== rec; }).map(formatMenuItem);
    return { signatureMenu: formatMenuItem(rec), otherMenu: others };
  }
  // cacheNs로 캐시 키를 구분해서 카카오/네이버 메뉴가 서로 캐시를 덮어쓰지 않게 한다.
  function fetchMenuFrom(proxyParam, placeId, cacheNs, source){
    if(!CONFIG.MENU_PROXY_URL) return Promise.resolve(null);
    var cacheKey = cacheNs + ':' + placeId;
    var cached = menuCacheGet(cacheKey);
    if(cached !== undefined) return Promise.resolve(cached ? Object.assign({}, cached, { source: source }) : null);
    var url = CONFIG.MENU_PROXY_URL + (CONFIG.MENU_PROXY_URL.indexOf('?')===-1?'?':'&') + proxyParam + '=' + encodeURIComponent(placeId);
    return fetch(url).then(function(resp){
      if(!resp.ok) throw new Error('menu proxy status ' + resp.status);
      return resp.json();
    }).then(function(data){
      var fields = toMenuFields(data && data.items);
      menuCacheSet(cacheKey, fields); // null(메뉴 없음)도 캐싱해서 매번 재호출하지 않음
      return fields ? Object.assign({}, fields, { source: source }) : null;
    }).catch(function(err){
      console.warn('[lunch-recommender] 메뉴 보강 실패 (' + cacheNs + '=' + placeId + '):', err && err.message);
      return null;
    });
  }
  function fetchMenuFor(placeId){ return fetchMenuFrom('placeId', placeId, 'kakao', 'kakao-live'); }
  function fetchNaverMenuFor(placeId){ return fetchMenuFrom('naverPlaceId', placeId, 'naver', 'naver-live'); }
  // rawList(mergeRecord 이전의 원본 배열)를 동시성 제한을 걸어 순회하며 메뉴 필드를 채워 넣는다.
  // 네이버 place id가 수동으로 입력돼 있으면(대개 상점주가 더 잘 관리해둠) 그쪽을 우선 시도하고,
  // 없거나 실패하면 카카오 실시간 메뉴로 폴백한다. 배열 원소를 직접 mutate하므로, 끝난 뒤
  // setRestaurants(rawList)를 다시 호출하면 반영된다.
  function enrichMenus(rawList){
    var queue = rawList.filter(function(r){ return r.kakaoPlaceId != null || r.naverPlaceId; }).slice();
    function worker(){
      var item = queue.shift();
      if(!item) return Promise.resolve();
      var task = item.naverPlaceId
        ? fetchNaverMenuFor(item.naverPlaceId).then(function(fields){ return fields || (item.kakaoPlaceId ? fetchMenuFor(item.kakaoPlaceId) : null); })
        : fetchMenuFor(item.kakaoPlaceId);
      return task.then(function(fields){
        if(fields){
          item.signatureMenu = fields.signatureMenu;
          item.otherMenu = fields.otherMenu;
          item.menuSource = fields.source;
        }
      }).then(worker);
    }
    var pool = [];
    for(var i=0;i<CONFIG.MENU_FETCH_CONCURRENCY;i++) pool.push(worker());
    return Promise.all(pool);
  }

  // ============ 지도 렌더 ============
  function renderMap(officeCoord){
    if(state.mode !== 'live' || !window.kakao || !kakao.maps) return;
    var container = $('map');
    var center = new kakao.maps.LatLng(officeCoord.lat, officeCoord.lng);
    var map = new kakao.maps.Map(container, { center:center, level:4 });
    state.map = map;
    state.highlightMarker = null; // 지도를 새로 만들었으니 이전 하이라이트 참조는 무효
    state.highlightInfoWindow = null;
    new kakao.maps.Marker({ position:center, map:map });
    new kakao.maps.Circle({
      center:center, radius:CONFIG.RADIUS_M, strokeWeight:2, strokeColor:'#ff6b35', strokeOpacity:.8,
      fillColor:'#ff6b35', fillOpacity:.12, map:map
    });
    state.restaurants.forEach(function(r){
      if(r.lat == null || r.lng == null) return;
      var pos = new kakao.maps.LatLng(r.lat, r.lng);
      var marker = new kakao.maps.Marker({ position:pos, map:map, opacity: r.isIncluded ? 1 : 0.35 });
      var iw = new kakao.maps.InfoWindow({ content:'<div style="padding:4px 8px;font-size:12px;white-space:nowrap;">'+r.name+'</div>' });
      kakao.maps.event.addListener(marker, 'click', function(){ iw.open(map, marker); });
    });
  }

  // 추천 결과 마커를 눈에 띄는 핀으로 표시하고 지도 중심을 그쪽으로 이동시킨다.
  var highlightMarkerImage = null;
  function getHighlightMarkerImage(){
    if(highlightMarkerImage) return highlightMarkerImage;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="0 0 36 46">' +
      '<path d="M18 0C8 0 0 8 0 18c0 12.5 18 28 18 28s18-15.5 18-28C36 8 28 0 18 0z" fill="#1f8a70" stroke="#ffffff" stroke-width="2"/>' +
      '<circle cx="18" cy="18" r="7" fill="#ffffff"/></svg>';
    var uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    highlightMarkerImage = new kakao.maps.MarkerImage(uri, new kakao.maps.Size(36,46), { offset: new kakao.maps.Point(18,46) });
    return highlightMarkerImage;
  }
  function highlightResult(r){
    if(state.mode !== 'live' || !state.map || !r || r.lat == null || r.lng == null) return;
    if(state.highlightMarker){ state.highlightMarker.setMap(null); }
    if(state.highlightInfoWindow){ state.highlightInfoWindow.close(); }
    var pos = new kakao.maps.LatLng(r.lat, r.lng);
    var marker = new kakao.maps.Marker({ position:pos, map:state.map, image:getHighlightMarkerImage(), zIndex:10 });
    var iw = new kakao.maps.InfoWindow({
      content:'<div style="padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;">'+r.name+'</div>',
      zIndex:10
    });
    iw.open(state.map, marker);
    state.highlightMarker = marker;
    state.highlightInfoWindow = iw;
    state.map.panTo(pos);
  }

  // ============ 필터/추천 ============
  function toggleSelected(group, value){
    var arr = state.selected[group];
    var idx = arr.indexOf(value);
    if(idx === -1) arr.push(value); else arr.splice(idx,1);
  }
  function matchesTags(r){
    var sel = state.selected;
    var typeOk = sel.type.length === 0 || sel.type.some(function(t){ return r.tags.type.indexOf(t) !== -1; });
    var tasteOk = sel.taste.length === 0 || sel.taste.indexOf(r.tags.taste) !== -1;
    var cuisineOk = sel.cuisine.length === 0 || sel.cuisine.indexOf(r.tags.cuisine) !== -1;
    return typeOk && tasteOk && cuisineOk;
  }
  function candidatePool(){
    return state.restaurants.filter(function(r){ return r.isIncluded && matchesTags(r); });
  }
  function pickRandom(){
    var pool = candidatePool();
    if(pool.length === 0) return null;
    var fresh = pool.filter(function(r){ return state.recentIds.indexOf(r.id) === -1; });
    var from = fresh.length > 0 ? fresh : pool;
    var chosen = from[Math.floor(Math.random()*from.length)];
    state.recentIds.push(chosen.id);
    if(state.recentIds.length > Math.max(1, pool.length - 1)) state.recentIds.shift();
    return chosen;
  }

  // ============ 렌더링 ============
  function renderChips(){
    renderChipGroup('chips-type', TYPE_OPTIONS, 'type');
    renderChipGroup('chips-taste', TASTE_OPTIONS, 'taste');
    renderChipGroup('chips-cuisine', CUISINE_OPTIONS, 'cuisine');
  }
  function renderChipGroup(containerId, options, group){
    var c = $(containerId);
    c.innerHTML = '';
    options.forEach(function(opt){
      var chip = el('button', 'chip' + (state.selected[group].indexOf(opt)!==-1 ? ' active' : ''), opt);
      chip.type = 'button';
      chip.addEventListener('click', function(){
        toggleSelected(group, opt);
        renderChips();
        updateCtaState();
      });
      c.appendChild(chip);
    });
  }
  function updateCtaState(){
    var pool = candidatePool();
    var btn = $('recommendBtn'), help = $('ctaHelp');
    if(pool.length === 0){
      btn.disabled = true;
      help.hidden = false;
      help.textContent = '선택한 조건에 맞는 식당이 없어요. 조건을 줄여보세요.';
    } else {
      btn.disabled = false;
      help.hidden = true;
    }
  }
  function renderResult(r){
    var card = $('resultCard');
    if(!r){ card.hidden = true; return; }
    card.hidden = false;
    $('resultName').textContent = r.name;
    var metaParts = [];
    if(r.categoryName) metaParts.push(r.categoryName.replace(/^음식점\s*>\s*/,''));
    if(r.distanceM != null){
      metaParts.push(r.distanceM + 'm');
      var walkMin = Math.max(1, Math.round(r.distanceM / CONFIG.WALK_SPEED_M_PER_MIN));
      metaParts.push('도보 약 ' + walkMin + '분');
    }
    $('resultMeta').textContent = metaParts.join(' · ');
    $('resultSignature').textContent = r.signatureMenu || '(추천메뉴 미입력 — 아래 목록에서 편집해주세요)';
    var ul = $('resultOther'); ul.innerHTML = '';
    (r.otherMenu||[]).forEach(function(m){ ul.appendChild(el('li', null, m)); });
    if((r.otherMenu||[]).length === 0){ ul.appendChild(el('li', null, '(다른메뉴 미입력)')); }
    var link = $('resultMapLink');
    if(r.placeUrl){ link.href = r.placeUrl; link.style.display = ''; }
    else { link.href = 'https://map.kakao.com/?q=' + encodeURIComponent(r.name); link.style.display = ''; }
    // 길찾기: 카카오맵 공식 딥링크. 클릭하면 카카오맵에서 실제 경로·별점·리뷰까지 볼 수 있다.
    var dirLink = $('resultDirectionsLink');
    if(r.lat != null && r.lng != null){
      dirLink.href = 'https://map.kakao.com/link/to/' + encodeURIComponent(r.name) + ',' + r.lat + ',' + r.lng;
      dirLink.hidden = false;
    } else {
      dirLink.hidden = true;
    }
  }
  function onRecommend(){
    var r = pickRandom();
    state.currentResultId = r ? r.id : null;
    renderResult(r);
    highlightResult(r);
  }

  function renderList(){
    var body = $('listBody');
    body.innerHTML = '';
    if(state.restaurants.length === 0){
      body.appendChild(el('div','empty-state','아직 불러온 식당이 없어요.'));
      return;
    }
    var sorted = state.restaurants.slice().sort(function(a,b){ return (a.distanceM||0)-(b.distanceM||0); });
    var included = sorted.filter(function(r){ return r.isIncluded; });
    var excluded = sorted.filter(function(r){ return !r.isIncluded; });

    // 반경 밖 · 철길 반대편(제외 대상)은 애초에 추천 후보로 고려되지 않으므로 목록에서도 기본적으로
    // 숨긴다. 다만 자동 판정이 경계에서 틀렸을 때 수동으로 "포함"시켜 보정할 수 있어야 하므로
    // 완전히 없애지는 않고, 펼쳐볼 수 있는 접힘 영역으로만 남겨둔다.
    if(included.length === 0){
      body.appendChild(el('div','empty-state','반경 250m·1호선 서쪽 조건에 맞는 식당이 없어요.'));
    } else {
      included.forEach(function(r){ body.appendChild(buildRow(r)); });
    }

    if(excluded.length > 0){
      var labelFor = function(open){
        return (open ? '제외된 식당 숨기기' : '제외된 식당 ' + excluded.length + '곳 보기 (반경 밖 · 철길 반대편)');
      };
      var wrap = el('div','excluded-wrap');
      excluded.forEach(function(r){ wrap.appendChild(buildRow(r)); });
      var toggle = el('button','excluded-toggle', labelFor(false));
      toggle.type = 'button';
      toggle.addEventListener('click', function(){
        var open = wrap.classList.toggle('open');
        toggle.textContent = labelFor(open);
      });
      body.appendChild(toggle);
      body.appendChild(wrap);
    }
  }
  function buildRow(r){
    var row = el('div', 'r-row' + (r.isIncluded ? '' : ' excluded'));
    var top = el('div','r-row-top');
    var menuBadgeLabel = r.menuSource === 'naver-live' ? '네이버 메뉴' : (r.menuSource === 'kakao-live' ? '카카오 실시간 메뉴' : '');
    var badges = (r.edited ? '<span class="badge">수정됨</span>' : '') +
      (!r.edited && menuBadgeLabel ? '<span class="badge">' + menuBadgeLabel + '</span>' : '');
    top.appendChild(el('div','r-row-name', r.name + badges));
    top.appendChild(el('div','r-row-dist', (r.distanceM!=null? r.distanceM+'m':'')));
    row.appendChild(top);
    row.appendChild(el('div','r-row-cat', r.categoryName || ''));

    var sideToggle = el('div','side-toggle');
    var opts = [ ['auto','자동',null], ['in','포함',true], ['out','제외',false] ];
    opts.forEach(function(o){
      var b = el('button', 'toggle-' + o[0] + (r.manualOverride === o[2] ? ' on' : ''), o[1]);
      b.type = 'button';
      b.addEventListener('click', function(){
        var patch = { manualOverride: o[2] };
        var saved = saveOverride(r.id, patch);
        r.manualOverride = saved.manualOverride;
        r.isIncluded = r.manualOverride === null ? r.includedByGeometry : r.manualOverride;
        renderList(); updateCtaState();
      });
      sideToggle.appendChild(b);
    });
    row.appendChild(sideToggle);

    var editToggle = el('button','edit-toggle','정보 편집');
    editToggle.type = 'button';
    var form = buildEditForm(r);
    editToggle.addEventListener('click', function(){ form.classList.toggle('open'); });
    row.appendChild(editToggle);
    row.appendChild(form);
    return row;
  }
  function buildEditForm(r){
    var form = el('div','edit-form');

    var typeLabel = el('label', null, '형태 (복수 선택)');
    form.appendChild(typeLabel);
    var typeChips = el('div','chips');
    var localType = r.tags.type.slice();
    TYPE_OPTIONS.forEach(function(opt){
      var chip = el('button','chip'+(localType.indexOf(opt)!==-1?' active':''), opt);
      chip.type='button';
      chip.addEventListener('click', function(){
        var idx = localType.indexOf(opt);
        if(idx===-1) localType.push(opt); else localType.splice(idx,1);
        chip.classList.toggle('active');
      });
      typeChips.appendChild(chip);
    });
    form.appendChild(typeChips);

    form.appendChild(el('label', null, '맛'));
    var tasteSelect = el('select');
    TASTE_OPTIONS.forEach(function(opt){
      var o = el('option', null, opt); o.value = opt;
      if(opt === r.tags.taste) o.selected = true;
      tasteSelect.appendChild(o);
    });
    form.appendChild(tasteSelect);

    form.appendChild(el('label', null, '종류'));
    var cuisineSelect = el('select');
    CUISINE_OPTIONS.forEach(function(opt){
      var o = el('option', null, opt); o.value = opt;
      if(opt === r.tags.cuisine) o.selected = true;
      cuisineSelect.appendChild(o);
    });
    form.appendChild(cuisineSelect);

    // 네이버 place id: 자동 매칭이 안 돼서(공식 검색 API에 place id 자체가 없음) 수동 입력만
    // 지원한다. 한 번 입력해두면 이후 재검색에서도 유지되고, enrichMenus가 카카오보다 이 값을
    // 우선해 네이버 메뉴를 자동 조회한다(대개 카카오보다 상점주가 더 신경 써서 관리해둠).
    form.appendChild(el('label', null, '네이버 place id (선택 — 네이버지도 URL의 숫자, 또는 링크 전체 붙여넣기)'));
    var naverRow = el('div'); naverRow.style.display = 'flex'; naverRow.style.gap = '6px';
    var naverIdInput = el('input'); naverIdInput.type = 'text'; naverIdInput.style.flex = '1';
    naverIdInput.placeholder = '예: 38693015';
    naverIdInput.value = r.naverPlaceId || '';
    var naverSaveBtn = el('button', 'btn btn-outline', '저장 & 조회');
    naverSaveBtn.type = 'button';
    naverSaveBtn.style.flex = 'none';
    naverSaveBtn.addEventListener('click', function(){
      var m = naverIdInput.value.match(/(\d{5,})/);
      var naverPlaceId = m ? m[1] : '';
      if(!naverPlaceId){ alert('숫자로 된 네이버 place id를 찾을 수 없어요. 네이버지도 URL(pcmap.place.naver.com/restaurant/숫자/...)을 확인해주세요.'); return; }
      var saved = saveOverride(r.id, { naverPlaceId: naverPlaceId });
      r.naverPlaceId = saved.naverPlaceId;
      naverSaveBtn.disabled = true; naverSaveBtn.textContent = '조회 중…';
      fetchNaverMenuFor(naverPlaceId).then(function(fields){
        naverSaveBtn.disabled = false; naverSaveBtn.textContent = '저장 & 조회';
        if(fields){
          r.signatureMenu = fields.signatureMenu; r.otherMenu = fields.otherMenu; r.menuSource = fields.source;
          sigInput.value = r.signatureMenu;
          otherInput.value = r.otherMenu.join(', ');
          renderList(); updateCtaState();
        } else {
          alert('메뉴를 찾지 못했어요. place id가 맞는지, 그 식당에 메뉴 탭이 있는지 확인해주세요.');
        }
      });
    });
    naverRow.appendChild(naverIdInput);
    naverRow.appendChild(naverSaveBtn);
    form.appendChild(naverRow);

    form.appendChild(el('label', null, '추천메뉴 (대표메뉴 1개)'));
    var sigInput = el('input'); sigInput.type='text'; sigInput.value = r.signatureMenu || '';
    form.appendChild(sigInput);

    form.appendChild(el('label', null, '다른메뉴 (쉼표로 구분)'));
    var otherInput = el('textarea'); otherInput.value = (r.otherMenu||[]).join(', ');
    form.appendChild(otherInput);

    var saveBtn = el('button','btn primary','저장');
    saveBtn.type='button';
    saveBtn.style.marginTop = '8px';
    saveBtn.addEventListener('click', function(){
      var otherMenu = otherInput.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var patch = {
        tags: { type: localType, taste: tasteSelect.value, cuisine: cuisineSelect.value },
        signatureMenu: sigInput.value.trim(),
        otherMenu: otherMenu,
        menuSource: 'manual',
        edited: true
      };
      var saved = saveOverride(r.id, patch);
      r.tags = saved.tags; r.signatureMenu = saved.signatureMenu; r.otherMenu = saved.otherMenu; r.edited = true;
      renderList(); updateCtaState();
    });
    form.appendChild(saveBtn);
    return form;
  }

  function renderAll(officeCoord){
    renderChips();
    updateCtaState();
    renderList();
    if(state.mode === 'live' && officeCoord){
      $('mapCard').hidden = false;
      renderMap(officeCoord);
    } else {
      $('mapCard').hidden = true;
    }
    $('lastSearchAt').textContent = '마지막 검색: ' + new Date().toLocaleString('ko-KR');
    storageSet('lastSearchAt', new Date().toISOString());
    // 처음 열었을 때도 바로 추천 결과가 보이도록 자동으로 한 번 뽑아둔다.
    if(candidatePool().length > 0){ onRecommend(); } else { renderResult(null); }
  }

  // 카카오 목록은 이미 화면에 그려둔 상태에서, 실제 메뉴를 백그라운드로 마저 받아와 반영한다.
  // (식당이 많으면 전체 조회에 몇 초 걸릴 수 있어, 먼저 키워드 추정치로 화면을 채워두고 나중에 갱신)
  function enrichAndRefresh(rawList){
    if(!CONFIG.MENU_PROXY_URL) return;
    // 사용자가 "정보 편집"에서 저장해둔 naverPlaceId(overrides)는 raw 객체엔 없고 이미 병합된
    // state.restaurants에만 있으므로, enrichMenus가 참조할 수 있게 raw 쪽에 복사해 넣는다.
    var byId = {};
    state.restaurants.forEach(function(r){ byId[r.id] = r; });
    rawList.forEach(function(raw){
      var merged = byId[raw.id];
      if(merged && merged.naverPlaceId) raw.naverPlaceId = merged.naverPlaceId;
    });
    var foot = $('lastSearchAt');
    var prevText = foot.textContent;
    foot.textContent = prevText + ' · 메뉴 불러오는 중…';
    enrichMenus(rawList).then(function(){
      setRestaurants(rawList);
      renderList();
      updateCtaState();
      if(state.currentResultId){
        var current = state.restaurants.filter(function(r){ return r.id === state.currentResultId; })[0];
        if(current) renderResult(current);
      }
      foot.textContent = prevText;
    });
  }

  function showFallbackBanner(msg){
    var b = $('fallbackBanner');
    b.hidden = false;
    if(msg){ b.firstChild ? (b.childNodes[0].textContent = msg) : null; }
  }
  function hideFallbackBanner(){ $('fallbackBanner').hidden = true; }

  // ============ 부트스트랩 ============
  function init(){
    state.recentIds = [];
    loadKakaoSdk()
      .then(kakaoReady)
      .then(fetchLiveRestaurants)
      .then(function(res){
        state.mode = 'live';
        hideFallbackBanner();
        setRestaurants(res.list);
        renderAll(res.officeCoord);
        enrichAndRefresh(res.list);
      })
      .catch(function(err){
        console.warn('[lunch-recommender] 카카오 라이브 검색 실패, 예시 데이터로 대체합니다:', err && err.message);
        state.mode = 'seed';
        showFallbackBanner();
        setRestaurants(getSeedRestaurants());
        renderAll(null);
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    $('recommendBtn').addEventListener('click', onRecommend);
    $('rerollBtn').addEventListener('click', onRecommend);
    $('resetFilters').addEventListener('click', function(){
      state.selected = { type:[], taste:[], cuisine:[] };
      renderChips(); updateCtaState();
    });
    $('researchBtn').addEventListener('click', init);
    $('retryLiveBtn').addEventListener('click', init);
    init();
  });
})();
</script>

</body></html>
